  <meta name="apple-mobile-web-app-title" content="Расписание">

  <style>
:root {
  color-scheme: dark;
  --bg: #0d1220;
  --bg-glow-1: rgba(110, 130, 255, .18);
  --bg-glow-2: rgba(70, 200, 180, .12);
  --surface: #172033;
  --surface-2: #1e2942;
  --text: #e9eefb;
  --muted: #93a1c0;
  --line: rgba(255, 255, 255, .09);
  --accent: #7b8cff;
  --accent-2: #a78bfa;
  --accent-ink: #0b1020;
  --now: #4ade80;
  --radius: 18px;
  --shadow: 0 12px 32px rgba(0, 0, 0, .32);
}

html[data-theme="light"] {
  color-scheme: light;
  --bg: #f1f4fb;
  --bg-glow-1: rgba(110, 130, 255, .22);
  --bg-glow-2: rgba(70, 200, 180, .16);
  --surface: #ffffff;
  --surface-2: #f4f6fd;
  --text: #101a2e;
  --muted: #64708c;
  --line: rgba(16, 26, 46, .09);
  --accent: #5563e8;
  --accent-2: #7c5ce0;
  --accent-ink: #ffffff;
  --now: #12a05a;
  --shadow: 0 10px 26px rgba(30, 45, 80, .12);
}

html[data-theme="ocean"] {
  color-scheme: dark;
  --bg: #071a2d;
  --bg-glow-1: rgba(44, 190, 255, .2);
  --bg-glow-2: rgba(52, 220, 190, .14);
  --surface: #0d2a45;
  --surface-2: #123b5d;
  --text: #e5f7ff;
  --muted: #8fb9cc;
  --line: rgba(160, 225, 255, .14);
  --accent: #49c6ff;
  --accent-2: #5b8cff;
  --accent-ink: #061522;
  --now: #4adea0;
  --shadow: 0 12px 32px rgba(0, 8, 20, .38);
}

html[data-theme="sunset"] {
  color-scheme: dark;
  --bg: #24131b;
  --bg-glow-1: rgba(255, 128, 86, .22);
  --bg-glow-2: rgba(218, 92, 202, .16);
  --surface: #3a1f2b;
  --surface-2: #51293a;
  --text: #fff0f1;
  --muted: #d4a8b1;
  --line: rgba(255, 218, 225, .14);
  --accent: #ff9060;
  --accent-2: #d76bff;
  --accent-ink: #2b1021;
  --now: #72d6a1;
  --shadow: 0 12px 32px rgba(28, 5, 18, .4);
}

html[data-theme="forest"] {
  color-scheme: dark;
  --bg: #0e1e19;
  --bg-glow-1: rgba(86, 200, 135, .2);
  --bg-glow-2: rgba(183, 213, 94, .12);
  --surface: #153129;
  --surface-2: #1d4234;
  --text: #ecfff3;
  --muted: #9dc4ac;
  --line: rgba(195, 245, 208, .14);
  --accent: #57c887;
  --accent-2: #b3d65e;
  --accent-ink: #092015;
  --now: #71e2a5;
  --shadow: 0 12px 32px rgba(3, 15, 9, .4);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  background:
    radial-gradient(900px 520px at 12% -8%, var(--bg-glow-1), transparent 70%),
    radial-gradient(760px 460px at 100% 4%, var(--bg-glow-2), transparent 72%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

.app {
  max-width: 540px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 28px);
}

/* ---------- шапка ---------- */

.topbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding-top: 4px;
}

.titles h1 {
  margin: 0;
  font-size: 27px;
  font-weight: 700;
  letter-spacing: -.02em;
}

.subtitle {
  margin: 4px 0 0;
  font-size: 13.5px;
  color: var(--muted);
  min-height: 18px;
}

.app-version {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 11px;
  opacity: .78;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-top: 3px;
}

.theme-picker {
  position: relative;
}

.theme-menu {
  position: absolute;
  z-index: 30;
  top: calc(100% + 8px);
  right: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 150px;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: color-mix(in srgb, var(--surface) 96%, transparent);
  box-shadow: var(--shadow);
  backdrop-filter: blur(14px);
}

.theme-menu[hidden] { display: none; }

.theme-menu button {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 36px;
  padding: 7px 9px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 12px;
  text-align: left;
  cursor: pointer;
}

.theme-menu button:hover,
.theme-menu button:focus-visible { background: var(--surface-2); }
.theme-menu button span { width: 20px; font-size: 16px; text-align: center; }

.icon-btn {
  width: 40px;
  height: 40px;
  flex: none;
  border-radius: 13px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  font-size: 17px;
  line-height: 1;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: transform .12s ease, background .15s ease;
}

.icon-btn:active { transform: scale(.94); }

.icon-btn.is-off {
  opacity: .45;
  filter: grayscale(.4);
}

.ghost-btn {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-size: 13.5px;
  font-weight: 600;
  padding: 9px 14px;
  border-radius: 12px;
  cursor: pointer;
  transition: transform .12s ease;
}

.ghost-btn:active { transform: scale(.96); }

/* ---------- погода ---------- */

.weather-card {
  padding: 15px;
  border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--line));
  border-radius: var(--radius);
  background:
    radial-gradient(220px 120px at 100% 0%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 75%),
    var(--surface);
  box-shadow: var(--shadow);
}

.weather-main {
  display: flex;
  align-items: center;
  gap: 11px;
}

.weather-icon {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  flex: none;
  font-size: 32px;
  line-height: 1;
}

.weather-heading { min-width: 0; }

.weather-kicker {
  margin: 0;
  font-size: 12px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .04em;
  font-weight: 700;
}

.weather-place {
  margin: 2px 0 0;
  font-size: 16px;
  font-weight: 700;
}

.weather-temp {
  margin-left: auto;
  font-size: 34px;
  font-weight: 750;
  line-height: 1;
  letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
}

.weather-details {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 10px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 12px;
}

.weather-details span:not(:first-child)::before {
  content: '·';
  margin-right: 10px;
  color: var(--accent);
}

.weather-forecast {
  display: none;
}

.weather-day {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 9px 5px 8px;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  text-align: center;
}

.weather-day-name {
  font-size: 11px;
  color: var(--muted);
  text-transform: capitalize;
}

.weather-day-icon { font-size: 22px; line-height: 1.1; }

.weather-day-temp {
  font-size: 14px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.weather-day-temp small {
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
}

.weather-day-rain {
  min-height: 14px;
  color: var(--muted);
  font-size: 10px;
  white-space: nowrap;
}

.weather-hourly-block {
  margin-top: 13px;
  padding-top: 11px;
  border-top: 1px solid var(--line);
}

.weather-hourly-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 2px;
  color: var(--text);
  font-size: 12px;
  font-weight: 700;
}

.weather-day-button {
  min-height: 34px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface-2);
  color: var(--text);
  font: inherit;
  font-size: 11px;
  font-weight: 650;
  cursor: pointer;
}

.weather-day-button:active { transform: scale(.97); }

.weather-day-menu {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
  padding: 7px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--surface-2);
}

.weather-day-menu[hidden] { display: none; }

.weather-day-option {
  flex: 1 1 70px;
  min-height: 32px;
  padding: 6px 8px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--muted);
  font: inherit;
  font-size: 11px;
  cursor: pointer;
}

.weather-day-option[aria-selected="true"] {
  border-color: transparent;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: var(--accent-ink);
}

.weather-hourly {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 8px 2px 2px;
  scrollbar-width: thin;
  scrollbar-color: var(--accent) transparent;
  -webkit-overflow-scrolling: touch;
}

.weather-hourly::-webkit-scrollbar { height: 4px; }
.weather-hourly::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 99px; }

.weather-hour {
  flex: 0 0 57px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 7px 4px 6px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-2);
  text-align: center;
}

.weather-hour-time {
  color: var(--muted);
  font-size: 10px;
  white-space: nowrap;
}

.weather-hour-icon { font-size: 20px; line-height: 1.1; }
.weather-hour strong { font-size: 13px; font-variant-numeric: tabular-nums; }
.weather-hour-rain { color: var(--muted); font-size: 10px; }
.weather-hourly-empty { color: var(--muted); font-size: 11px; padding: 8px 2px; }

.weather-status {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 10.5px;
  text-align: right;
}

.weather-card.is-loading { opacity: .72; }
.weather-card.is-error { border-color: color-mix(in srgb, var(--orange, #d5803b) 45%, var(--line)); }

/* ---------- переключатель недель ---------- */

.week-switch {
  display: flex;
  gap: 6px;
  padding: 5px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 16px;
}

.week-switch button {
  flex: 1 1 0;
  min-width: 0;
  padding: 11px 8px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  transition: background .18s ease, color .18s ease, box-shadow .18s ease;
}

.week-switch button[aria-selected="true"] {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: var(--accent-ink);
  box-shadow: 0 6px 18px -6px var(--accent);
}

/* ---------- дни ---------- */

.day-tabs {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  padding: 2px 2px 4px;
  margin: 0 -2px;
}

.day-tabs::-webkit-scrollbar { display: none; }

.day-tab {
  flex: 0 0 auto;
  min-width: 52px;
  padding: 9px 10px 8px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font: inherit;
  transition: background .18s ease, color .18s ease, transform .12s ease, border-color .18s ease;
}

.day-tab:active { transform: scale(.96); }

.day-tab .d-name {
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: .02em;
}

.day-tab .d-date {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}

.day-tab[aria-current="true"] {
  border-color: color-mix(in srgb, var(--accent) 55%, transparent);
}

.day-tab.is-today .d-name { color: var(--accent); }

.day-tab[aria-selected="true"] {
  background: linear-gradient(160deg, var(--accent), var(--accent-2));
  border-color: transparent;
  color: var(--accent-ink);
  box-shadow: 0 8px 20px -10px var(--accent);
}

.day-tab[aria-selected="true"] .d-date,
.day-tab[aria-selected="true"] .d-name { color: var(--accent-ink); }

.day-tab.is-empty { opacity: .55; }

/* ---------- список пар ---------- */

.content {
  display: flex;
  flex-direction: column;
  gap: 9px;
  flex: 1 1 auto;
}

.content.still .lesson { animation: none; }

/* ---------- плашка-отчёт «до начала пары» ---------- */

.status {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 14px 16px;
  border-radius: var(--radius);
  border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%),
    var(--surface);
  box-shadow: var(--shadow);
}

.status-label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--muted);
}

.status-value {
  font-size: 30px;
  font-weight: 750;
  line-height: 1.15;
  letter-spacing: -.02em;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

.status-sub {
  font-size: 13px;
  color: var(--muted);
  overflow-wrap: anywhere;
}

.status-live {
  border-color: color-mix(in srgb, var(--now) 45%, transparent);
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--now) 14%, transparent), transparent 70%),
    var(--surface);
}

.status-live .status-value { color: var(--now); }

.status-done {
  flex-direction: row;
  align-items: baseline;
  gap: 8px;
  border-color: var(--line);
  background: var(--surface);
  box-shadow: none;
}

.status-done .status-label { color: var(--text); }

.tomorrow-preview {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-top: 4px;
}

.tomorrow-tab {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  min-height: 48px;
  padding: 11px 14px;
  border: 1px solid color-mix(in srgb, var(--accent) 42%, var(--line));
  border-radius: var(--radius);
  background:
    linear-gradient(120deg, color-mix(in srgb, var(--accent) 16%, transparent), transparent 75%),
    var(--surface);
  color: var(--text);
  font: inherit;
  font-size: 13.5px;
  font-weight: 700;
  text-align: left;
  cursor: pointer;
  box-shadow: 0 8px 22px -14px var(--accent);
}

.tomorrow-tab:active { transform: scale(.985); }

.tomorrow-date {
  flex: none;
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
}

.tomorrow-lessons {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.tomorrow-lessons .lesson {
  box-shadow: none;
}

.tomorrow-empty {
  padding: 15px 16px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  color: var(--muted);
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  font-size: 13px;
  text-align: center;
}

.t-left {
  margin-top: 3px;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
}

.lesson.now .t-left { color: var(--now); }

.lesson {
  position: relative;
  display: flex;
  gap: 13px;
  align-items: flex-start;
  padding: 14px 14px 14px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  animation: rise .26s ease both;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

.lesson.past { opacity: .5; }

.lesson.now {
  border-color: color-mix(in srgb, var(--now) 55%, transparent);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--now) 30%, transparent), var(--shadow);
}

.lesson-time {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-top: 1px;
  min-width: 46px;
  font-variant-numeric: tabular-nums;
}

.lesson-time .t-start {
  font-size: 14.5px;
  font-weight: 700;
}

.lesson-time .t-end {
  font-size: 12px;

  const LATEST_RELEASE_URL = 'https://api.github.com/repos/Krocozab/raspisanie-3.0/releases/latest';

  const DAYS = [
    { key: 'mon', short: 'Пн', full: 'Понедельник' },
    { key: 'tue', short: 'Вт', full: 'Вторник' },
    { key: 'wed', short: 'Ср', full: 'Среда' },
    { key: 'thu', short: 'Чт', full: 'Четверг' },
    { key: 'fri', short: 'Пт', full: 'Пятница' },
    { key: 'sat', short: 'Сб', full: 'Суббота' },
    { key: 'sun', short: 'Вс', full: 'Воскресенье' },
  ];

  const MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

  /* ---------------- даты ---------------- */

  function startOfDay(d) {
    const x = new Date(d);
    x.setHours(0, 0, 0, 0);
    return x;
  }

  function mondayOf(date) {
    const d = startOfDay(date);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return d;
  }

  function parseDate(str) {
    if (!str) return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(str).trim());
    if (!m) return null;
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d.getTime()) ? null : d;
  }

  function addDays(date, n) {
    const d = new Date(date);
    d.setDate(d.getDate() + n);
    return d;
  }

  function daysBetween(a, b) {
    return Math.round((startOfDay(b) - startOfDay(a)) / 86400000);
  }

  const TODAY = new Date();
  const TODAY_IDX = (TODAY.getDay() + 6) % 7;
  const BASE_MONDAY = mondayOf(TODAY);

  const semesterStart = parseDate(DATA.meta && DATA.meta.semesterStart);

  function rawCycleIndex(monday) {
    if (!semesterStart) return 0;
    const passed = Math.floor(daysBetween(mondayOf(semesterStart), monday) / 7);
    return ((passed % N) + N) % N;
  }

  function loadCalib() {
    try {
      const v = parseInt(localStorage.getItem('schedule.calib'), 10);
      return Number.isFinite(v) ? ((v % N) + N) % N : 0;
    } catch (e) {
      return 0;
    }
  }

  function saveCalib(v) {
    try { localStorage.setItem('schedule.calib', String((v % N + N) % N)); } catch (e) { /* ignore */ }

  let calib = loadCalib();

  function autoIndex() {
    return (rawCycleIndex(BASE_MONDAY) + calib) % N;
  }

  const state = {
    offset: 0,
    day: TODAY_IDX,
  };

  function currentWeek() {
    return WEEKS[(autoIndex() + state.offset) % N] || WEEKS[0];
  }

  function shownMonday() {
    return addDays(BASE_MONDAY, state.offset * 7);
  }

  }

  let selectedWeatherDay = 0;
  let latestWeatherData = null;

  function renderWeatherDayMenu(daily) {
    const dates = Array.isArray(daily.time) ? daily.time : [];
    if (!dates.length) return;
    if (selectedWeatherDay >= dates.length) selectedWeatherDay = 0;
    weatherDayButton.textContent = weatherDayLabel(dates[selectedWeatherDay], selectedWeatherDay) + ' ▾';
    weatherDayMenu.innerHTML = dates.map(function (date, index) {
      return '<button type="button" class="weather-day-option" role="option" aria-selected="' +
        (index === selectedWeatherDay ? 'true' : 'false') + '" data-weather-day="' + index + '">' +
        esc(weatherDayLabel(date, index)) + '</button>';
    }).join('');
  }

  function renderHourlyWeather(data) {
    const current = data.current || {};
    const hourly = data.hourly || {};
    const hourlyTimes = Array.isArray(hourly.time) ? hourly.time : [];
    const dayStart = selectedWeatherDay * 24;
    const morningHour = 5;
    let firstHour = dayStart + morningHour;
    if (selectedWeatherDay === 0 && current.time) {
      const currentHour = hourlyTimes.findIndex(function (time) { return time >= current.time; });
      if (currentHour >= 0) firstHour = Math.max(dayStart + morningHour, currentHour);
    }
    const hourlyItems = hourlyTimes.slice(firstHour, firstHour + 12).map(function (time, i) {
      const dataIndex = firstHour + i;
      const hourInfo = weatherInfo(hourly.weather_code && hourly.weather_code[dataIndex]);
      const chance = hourly.precipitation_probability && hourly.precipitation_probability[dataIndex];
      return '<div class="weather-hour">' +
        '<span class="weather-hour-time">' + esc(weatherHourLabel(time, i, selectedWeatherDay === 0)) + '</span>' +
        '<span class="weather-hour-icon" aria-hidden="true">' + hourInfo[0] + '</span>' +
        '<strong>' + formatWeatherTemp(hourly.temperature_2m && hourly.temperature_2m[dataIndex]) + '</strong>' +
        '<span class="weather-hour-rain">' + (chance == null ? '—' : Math.round(chance) + '%') + '</span>' +
        '</div>';
    });
    weatherHourly.innerHTML = hourlyItems.length ? hourlyItems.join('') : '<span class="weather-hourly-empty">Почасовой прогноз недоступен</span>';
  }

  function renderWeather(data) {
    latestWeatherData = data;
    const current = data.current || {};
    const daily = data.daily || {};
    const info = weatherInfo(current.weather_code);
    const humidity = Number.isFinite(Number(current.relative_humidity_2m)) ? Math.round(current.relative_humidity_2m) : '—';
    const wind = Number.isFinite(Number(current.wind_speed_10m)) ? Math.round(current.wind_speed_10m) : '—';

    weatherCard.classList.remove('is-loading', 'is-error');
    weatherIcon.textContent = info[0];
    weatherIcon.setAttribute('aria-label', info[1]);
    weatherTemp.textContent = formatWeatherTemp(current.temperature_2m);
    weatherDetails.innerHTML =
      '<span>' + esc(info[1]) + '</span>' +
      '<span>Ощущается ' + formatWeatherTemp(current.apparent_temperature) + '</span>' +
      '<span>Влажность ' + humidity + '%</span>' +
      '<span>Ветер ' + wind + ' км/ч</span>';

    weatherForecast.innerHTML = '';
    renderWeatherDayMenu(daily);
    renderHourlyWeather(data);

    const updated = current.time ? new Date(current.time).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
    weatherStatus.textContent = updated ? 'Обновлено в ' + updated + ' · прогноз Open-Meteo' : 'Прогноз Open-Meteo';
  }

  function showWeatherError() {
    weatherCard.classList.remove('is-loading');
    weatherCard.classList.add('is-error');
    weatherIcon.textContent = '⚠️';
    weatherIcon.setAttribute('aria-label', 'Ошибка загрузки');
    weatherTemp.textContent = '—';
    weatherDetails.innerHTML = '<span>Погода временно недоступна</span>';
    weatherForecast.innerHTML = '';
    weatherHourly.innerHTML = '';
    weatherStatus.textContent = 'Проверьте подключение к интернету';
  }

  let weatherRequestInFlight = false;

  async function loadWeather() {
    if (!weatherCard || weatherRequestInFlight) return;
    weatherRequestInFlight = true;
    weatherCard.classList.add('is-loading');
    try {
      const response = await fetch(WEATHER_URL, { cache: 'no-store' });
      if (!response.ok) throw new Error('Weather request failed');
      renderWeather(await response.json());
    } catch (error) {
      showWeatherError();
    } finally {
      weatherRequestInFlight = false;
    }
  }

  if (weatherDayButton && weatherDayMenu) {
    weatherDayButton.addEventListener('click', function () {
      const isOpen = !weatherDayMenu.hidden;
      weatherDayMenu.hidden = isOpen;
      weatherDayButton.setAttribute('aria-expanded', String(!isOpen));
    });

    weatherDayMenu.addEventListener('click', function (event) {
      const option = event.target.closest && event.target.closest('[data-weather-day]');
      if (!option) return;
      selectedWeatherDay = Number(option.getAttribute('data-weather-day')) || 0;
      weatherDayMenu.hidden = true;
      weatherDayButton.setAttribute('aria-expanded', 'false');
      if (latestWeatherData) renderWeather(latestWeatherData);
    });

    document.addEventListener('click', function (event) {
      if (!weatherCard.contains(event.target)) {
        weatherDayMenu.hidden = true;
        weatherDayButton.setAttribute('aria-expanded', 'false');
      }
    });
  }

  /* ---------------- отрисовка ---------------- */

  function renderWeekSwitch() {
    const active = (autoIndex() + state.offset) % N;
    weekSwitchEl.innerHTML = '';

    WEEKS.forEach(function (week, i) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.setAttribute('role', 'tab');
      btn.textContent = week.label || ('Неделя ' + (i + 1));
      btn.setAttribute('aria-selected', String(i === active));
      btn.addEventListener('click', function () {
        state.offset = (i - autoIndex() + N) % N;
        render();
      });
      weekSwitchEl.appendChild(btn);
    });
  }

  function renderDayTabs() {
    const monday = shownMonday();
    const week = currentWeek();
    dayTabsEl.innerHTML = '';

    DAYS.forEach(function (day, i) {
      const date = addDays(monday, i);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'day-tab';
      btn.setAttribute('role', 'tab');

      const isSelected = i === state.day;
      btn.setAttribute('aria-selected', String(isSelected));

      if (i === TODAY_IDX && state.offset === 0) {
        btn.classList.add('is-today');
        btn.setAttribute('aria-current', 'true');
      }
      if (!hasLessons(week, day.key)) btn.classList.add('is-empty');

      btn.innerHTML =
        '<span class="d-name">' + day.short + '</span>' +
        '<span class="d-date">' + date.getDate() + '</span>';

      btn.addEventListener('click', function () {
        state.day = i;
        render();
      });

      dayTabsEl.appendChild(btn);

      if (isSelected) {
        requestAnimationFrame(function () {
          btn.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
        });
      }
    });
  }

  /** Находит пару, которая идёт сейчас, и следующую по времени. */
  function pickCurrentAndNext(lessons, now) {
    let current = -1;
    let next = -1;

    lessons.forEach(function (lesson, i) {
      const s = toMinutes(lesson.start);
      const e = toMinutes(lesson.end);
      if (s == null) return;
      if (e != null && now >= s && now < e) {
        if (current === -1) current = i;
        return;
      }
      if (now < s && next === -1) next = i;
    });

    return { current: current, next: next };
  }

  function statusHTML(lessons, now) {
    const found = pickCurrentAndNext(lessons, now);

    if (found.current >= 0) {
      const lesson = lessons[found.current];
      const end = toMinutes(lesson.end);
      const left = end == null ? null : end - now;
      return '<div class="status status-live">' +
        '<span class="status-label">Идёт пара</span>' +
        '<span class="status-value">' + (left == null ? 'сейчас' : humanMinutes(left)) + '</span>' +
        '<span class="status-sub">' + (left == null ? '' : 'до конца · ') +
          esc(lesson.subject || '') + (lesson.room ? ' · ' + esc(lesson.room) : '') + '</span>' +
        '</div>';
    }

    if (found.next >= 0) {
      const lesson = lessons[found.next];
      const diff = toMinutes(lesson.start) - now;
      return '<div class="status">' +
        '<span class="status-label">До начала пары</span>' +
        '<span class="status-value">' + humanMinutes(diff) + '</span>' +
        '<span class="status-sub">' + esc(lesson.start) + ' · ' + esc(lesson.subject || '') +
          (lesson.room ? ' · ' + esc(lesson.room) : '') + '</span>' +
        '</div>';
    }

    return '<div class="status status-done">' +
      '<span class="status-label">На сегодня</span>' +
      '<span class="status-sub">пар больше нет</span>' +
      '</div>';
  }

  function lessonListHTML(lessons, options) {
    const config = options || {};
    const onToday = !!config.onToday;
    const now = Number.isFinite(config.now) ? config.now : 0;
    const found = config.found || { current: -1, next: -1 };

    return lessons.map(function (lesson, idx) {
      const start = toMinutes(lesson.start);
      const end = toMinutes(lesson.end);
      const isNow = onToday && start != null && end != null && now >= start && now < end;
      const isPast = onToday && end != null && now >= end;
      const isNext = onToday && idx === found.next;

      const cls = ['lesson'];
      if (isNow) cls.push('now');
      else if (isPast) cls.push('past');

      let card = '<article class="' + cls.join(' ') + '" style="animation-delay:' + (idx * 22) + 'ms">';

      if (isNow) card += '<span class="badge-now">сейчас</span>';

      card += '<div class="lesson-time">' +
        '<span class="t-start">' + esc(lesson.start || '') + '</span>' +
        (lesson.end ? '<span class="t-end">' + esc(lesson.end) + '</span>' : '');

      if (isNext && start != null) {
        card += '<span class="t-left">через ' + humanMinutes(start - now) + '</span>';
      } else if (isNow && end != null) {
        card += '<span class="t-left">ещё ' + humanMinutes(end - now) + '</span>';
      }

      card += '</div>';
      card += '<div class="lesson-body"><p class="lesson-subject">';
      if (lesson.kind) card += '<span class="kind">' + esc(lesson.kind) + '</span>';
      card += esc(lesson.subject || 'Без названия');
      card += '</p>';

      const chips = [];
      if (lesson.room) chips.push('<span class="chip room">' + esc(lesson.room) + '</span>');
      if (lesson.teacher) chips.push('<span class="chip teacher">' + esc(lesson.teacher) + '</span>');
      if (chips.length) card += '<p class="lesson-meta">' + chips.join('') + '</p>';
      if (lesson.note) card += '<p class="lesson-note">' + esc(lesson.note) + '</p>';

      return card + '</div></article>';
    }).join('');
  }

  function renderContent(still) {
    if (still) contentEl.classList.add('still');

    const week = currentWeek();
    const dayKey = DAYS[state.day].key;
    const lessons = lessonsFor(week, dayKey);

    lessons.sort(function (a, b) {
      const am = toMinutes(a.start);
      const bm = toMinutes(b.start);
      return (am == null ? 9999 : am) - (bm == null ? 9999 : bm);
    });

    if (lessons.length === 0) {
      const isWeekend = state.day >= 5;
      contentEl.innerHTML =
        '<div class="empty">' +
        '<div class="emoji">' + (isWeekend ? '🌿' : '☕️') + '</div>' +
        '<div class="title">' + (isWeekend ? 'Выходной' : 'Пар нет') + '</div>' +
        '<div class="hint">' + esc(DAYS[state.day].full) + ' — занятий не найдено.</div>' +
        '</div>';
      if (still) requestAnimationFrame(function () { contentEl.classList.remove('still'); });
      return;
    }

    const onToday = state.offset === 0 && state.day === TODAY_IDX;
    const now = nowMinutes();
    const found = onToday ? pickCurrentAndNext(lessons, now) : { current: -1, next: -1 };

    let html = '';

    if (onToday) html += statusHTML(lessons, now);

    html += lessonListHTML(lessons, { onToday: onToday, now: now, found: found });

    if (onToday && found.current < 0 && found.next < 0) {
      const tomorrowDate = addDays(TODAY, 1);
      const tomorrowDay = (TODAY_IDX + 1) % 7;
      const tomorrowOffset = tomorrowDay === 0 ? 1 : 0;
      const tomorrowWeek = WEEKS[(autoIndex() + tomorrowOffset) % N] || WEEKS[0];
      const tomorrowLessons = lessonsFor(tomorrowWeek, DAYS[tomorrowDay].key);
      tomorrowLessons.sort(function (a, b) {
        const am = toMinutes(a.start);
        const bm = toMinutes(b.start);
        return (am == null ? 9999 : am) - (bm == null ? 9999 : bm);
      });

      html += '<section class="tomorrow-preview">' +
        '<button type="button" class="tomorrow-tab" id="tomorrowScheduleBtn">' +
          '<span>Расписание на завтра</span>' +
          '<span class="tomorrow-date">' + esc(DAYS[tomorrowDay].short + ' ' + tomorrowDate.getDate()) + '</span>' +
        '</button>';

      if (tomorrowLessons.length) {
        html += '<div class="tomorrow-lessons">' + lessonListHTML(tomorrowLessons, {}) + '</div>';
      } else {
        html += '<div class="tomorrow-empty">Завтра пар нет</div>';
      }
      html += '</section>';
    }

    contentEl.innerHTML = html;

    if (still) requestAnimationFrame(function () { contentEl.classList.remove('still'); });
  }

  function renderFootnote() {
    const monday = shownMonday();
    const sunday = addDays(monday, 6);
    const week = currentWeek();

    const range =
      monday.getDate() + ' ' + MONTHS[monday.getMonth()] + ' — ' +
      sunday.getDate() + ' ' + MONTHS[sunday.getMonth()];

    footnoteEl.innerHTML =
      '<span>' + esc(week.label || 'Неделя') + ' · ' + range + '</span>' +
      '<button type="button" class="link-btn" id="calibBtn" title="Если приложение считает неделю неверно">не та неделя?</button>';
  }

  function renderTodayBtn() {
    todayBtn.hidden = state.offset === 0 && state.day === TODAY_IDX;
  }

  function render() {
    renderWeekSwitch();
    renderDayTabs();
    renderContent(false);
    renderFootnote();
    renderTodayBtn();
    document.title = (currentWeek().label || 'Расписание') + ' · Расписание';
  }

  contentEl.addEventListener('click', function (event) {
    const tomorrowButton = event.target.closest && event.target.closest('#tomorrowScheduleBtn');
    if (!tomorrowButton) return;
    const tomorrowDay = (TODAY_IDX + 1) % 7;
    state.offset = tomorrowDay === 0 ? 1 : 0;
    state.day = tomorrowDay;
    render();
  });

  todayBtn.addEventListener('click', function () {
    state.offset = 0;
    state.day = TODAY_IDX;
    render();
  });

  footnoteEl.addEventListener('click', function (e) {
    const btn = e.target.closest && e.target.closest('#calibBtn');
    if (!btn) return;
    calib = (calib + 1) % N;
    saveCalib(calib);
    state.offset = 0;
    render();
  });

  /* ---------------- тема ---------------- */

  const THEME_META_COLORS = {
    dark: '#0d1220',
    light: '#f1f4fb',
    ocean: '#071a2d',
    sunset: '#24131b',
    forest: '#0e1e19',
  };

  function applyTheme(theme) {
    if (!THEME_META_COLORS[theme]) theme = 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', THEME_META_COLORS[theme]);
    try { localStorage.setItem('schedule.theme', theme); } catch (e) { /* ignore */ }
  }

  (function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem('schedule.theme'); } catch (e) { saved = null; }
    if (saved && THEME_META_COLORS[saved]) {
      applyTheme(saved);
    } else {
      const light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      applyTheme(light ? 'light' : 'dark');
    }
  })();

  themeBtn.addEventListener('click', function () {
    const isOpen = !themeMenu.hidden;
    themeMenu.hidden = isOpen;
    themeBtn.setAttribute('aria-expanded', String(!isOpen));
  });

  themeMenu.addEventListener('click', function (event) {
    const option = event.target.closest && event.target.closest('[data-theme-option]');
    if (!option) return;
    applyTheme(option.getAttribute('data-theme-option'));
    themeMenu.hidden = true;
    themeBtn.setAttribute('aria-expanded', 'false');
  });

  document.addEventListener('click', function (event) {
    if (!event.target.closest('.theme-picker')) {
      themeMenu.hidden = true;
      themeBtn.setAttribute('aria-expanded', 'false');
    }
  });

  /* ---------------- живое обновление счётчика ---------------- */

  function refreshLive() {
    if (state.offset !== 0 || state.day !== TODAY_IDX) return;
    renderContent(true);
  }

  setInterval(function () {
    if (document.hidden) return;
    refreshLive();
  }, 20000);

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      refreshLive();
      loadWeather();
    }
  });

  render();
  loadWeather();
  setInterval(function () {
    if (!document.hidden) loadWeather();
  }, 30 * 60 * 1000);

  /* ---------------- обновление приложения ---------------- */

  const appUpdateBtn = document.getElementById('appUpdateBtn');

  function compareVersions(a, b) {
    const left = String(a || '').replace(/^v/i, '').split('.').map(Number);
    const right = String(b || '').replace(/^v/i, '').split('.').map(Number);
    for (let i = 0; i < 3; i++) {
      const l = Number.isFinite(left[i]) ? left[i] : 0;
      const r = Number.isFinite(right[i]) ? right[i] : 0;
      if (l !== r) return l - r;
    }
    return 0;
  }

  function openUpdateUrl(url) {
    if (!url) return;
    if (window.AndroidApp && typeof window.AndroidApp.openUpdate === 'function') {
      window.AndroidApp.openUpdate(url);
    } else {
      window.open(url, '_blank', 'noopener');
    }
  }

  if (appUpdateBtn) {
    appUpdateBtn.addEventListener('click', function () {
      const url = appUpdateBtn.getAttribute('data-update-url');
      if (!url) return;
      appUpdateBtn.disabled = true;
      appUpdateBtn.textContent = 'Открываем загрузку…';
      openUpdateUrl(url);
    });
  }

  function checkLatestAppUpdate() {
    fetch(LATEST_RELEASE_URL, { cache: 'no-store', headers: { Accept: 'application/vnd.github+json' } })
      .then(function (response) { return response.ok ? response.json() : null; })
      .then(function (release) {
        if (!release || !release.tag_name || compareVersions(release.tag_name, APP_VERSION) <= 0 || !appUpdateBtn) return;
        const apk = Array.isArray(release.assets) ? release.assets.find(function (asset) {
          return asset && asset.name === 'raspisanie.apk';
        }) : null;
        appUpdateBtn.setAttribute('data-update-url', (apk && apk.browser_download_url) || release.html_url);
        appUpdateBtn.textContent = 'Обновить приложение · ' + release.tag_name;
        appUpdateBtn.hidden = false;
        appUpdateBtn.setAttribute('aria-label', 'Доступно обновление приложения ' + release.tag_name);
      })
      .catch(function () { /* проверка обновления необязательна для работы приложения */ });
  }

  // Проверяем обновление и в браузере, и внутри Android APK.
  checkLatestAppUpdate();
  setInterval(function () {
    if (!document.hidden) checkLatestAppUpdate();
  }, 30 * 60 * 1000);

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      let registration = null;
      let updateAccepted = false;

      function showUpdateButton() {
        if (!appUpdateBtn || appUpdateBtn.getAttribute('data-update-url')) return;
        appUpdateBtn.hidden = false;
        appUpdateBtn.setAttribute('aria-label', 'Доступно обновление приложения');
      }

      navigator.serviceWorker.register('sw.js').then(function (reg) {
        registration = reg;

        function revealWaitingUpdate() {
          if (reg.waiting && navigator.serviceWorker.controller) showUpdateButton();
        }

        // Проверяем обновление сразу при открытии приложения.
        revealWaitingUpdate();
        reg.update().then(revealWaitingUpdate).catch(function () { /* без обновления */ });

        reg.addEventListener('updatefound', function () {
          const installing = reg.installing;
          if (!installing) return;
          installing.addEventListener('statechange', function () {
            if (installing.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateButton();
            }
          });
        });

        setInterval(function () {
          if (!document.hidden) reg.update().then(revealWaitingUpdate).catch(function () { /* без обновления */ });
        }, 30 * 60 * 1000);
      }).catch(function () { /* без офлайна */ });

      if (appUpdateBtn) {
        appUpdateBtn.addEventListener('click', function () {
          if (appUpdateBtn.getAttribute('data-update-url')) return;
          updateAccepted = true;
          appUpdateBtn.disabled = true;
          appUpdateBtn.textContent = 'Обновляем…';
          if (registration && registration.waiting) {
            registration.waiting.postMessage({ type: 'SKIP_WAITING' });
          } else {
            window.location.reload();
          }
        });
      }

      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (updateAccepted) window.location.reload();
      });
    });
  }
})();

</script>
</body>
</html>
